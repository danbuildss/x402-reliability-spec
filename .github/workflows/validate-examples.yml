name: Validate Examples

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Validate examples and test-vector expectations against evidence-record schema
        run: |
          python3 - <<'EOF'
          import json
          import sys
          import os
          import jsonschema
          from jsonschema import validate, RefResolver

          schema_dir = os.path.abspath("schema")
          store = {}

          for fname in os.listdir(schema_dir):
              if fname.endswith(".json"):
                  with open(os.path.join(schema_dir, fname)) as f:
                      s = json.load(f)
                  if "$id" in s:
                      store[s["$id"]] = s

          with open("schema/evidence-record.json") as f:
              record_schema = json.load(f)

          resolver = RefResolver(
              base_uri=record_schema.get("$id", ""),
              referrer=record_schema,
              store=store,
          )

          paths = [os.path.join("examples", f) for f in sorted(os.listdir("examples")) if f.endswith(".json")]
          paths += [os.path.join("test-vectors", d, "expected.json") for d in sorted(os.listdir("test-vectors"))
                    if os.path.isdir(os.path.join("test-vectors", d))]

          errors = []
          for path in paths:
              fname = path
              with open(path) as f:
                  instance = json.load(f)
              try:
                  validate(instance=instance, schema=record_schema, resolver=resolver)
                  print(f"  OK  {fname}")
              except jsonschema.ValidationError as e:
                  errors.append((fname, str(e.message)))
                  print(f"  FAIL  {fname}: {e.message}")

          if errors:
              print(f"\n{len(errors)} validation error(s). See above.")
              sys.exit(1)
          else:
              print(f"\nAll examples valid.")
          EOF

      - name: Check all stages use valid names
        run: |
          python3 - <<'EOF'
          import json, os, sys

          valid_names = {
              "availability", "402_response", "payment_terms",
              "price_validity", "payment_processing", "delivery", "schema_validity"
          }

          paths = [f"examples/{f}" for f in os.listdir("examples") if f.endswith(".json")]
          paths += [f"test-vectors/{d}/expected.json" for d in os.listdir("test-vectors") if os.path.isdir(f"test-vectors/{d}")]

          errors = []
          for fname in paths:
              with open(fname) as f:
                  record = json.load(f)
              for stage in record.get("stages", []):
                  if stage.get("name") not in valid_names:
                      errors.append(f"{fname}: unknown stage name '{stage.get('name')}'")

          if errors:
              for e in errors:
                  print(f"  ERROR  {e}")
              sys.exit(1)
          else:
              print("All stage names valid.")
          EOF

      - name: Check test vectors are well-formed
        run: |
          python3 - <<'EOF'
          import json, os, sys

          errors = []
          for d in sorted(os.listdir("test-vectors")):
              base = os.path.join("test-vectors", d)
              if not os.path.isdir(base):
                  continue
              for need in ("vector.json", "expected.json"):
                  if not os.path.exists(os.path.join(base, need)):
                      errors.append(f"{d}: missing {need}")
              if errors:
                  continue
              v = json.load(open(os.path.join(base, "vector.json")))
              e = json.load(open(os.path.join(base, "expected.json")))
              for key in ("description", "checker", "unpaid", "paid"):
                  if key not in v:
                      errors.append(f"{d}: vector.json missing '{key}'")
              if e.get("spec_version") != "0.3":
                  errors.append(f"{d}: expected.json spec_version must be 0.3")
              if "outcome" not in e:
                  errors.append(f"{d}: expected.json must set outcome")
              if [s["stage"] for s in e.get("stages", [])] != list(range(1, 8)):
                  errors.append(f"{d}: expected.json must list stages 1-7 in order")
              for s in e.get("stages", []):
                  if s.get("passed") is False and s.get("fault") not in ("service", "checker"):
                      errors.append(f"{d}: failed stage {s['stage']} needs fault 'service' or 'checker'")
              if (e.get("outcome") == "checker_error") != any(s.get("fault") == "checker" for s in e.get("stages", [])):
                  errors.append(f"{d}: outcome checker_error <=> a stage with fault 'checker'")

          if errors:
              for e in errors:
                  print(f"  ERROR  {e}")
              sys.exit(1)
          print("All test vectors well-formed.")
          EOF
